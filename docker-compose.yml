services:
  floci:
    image: floci/floci:latest
    ports: ["127.0.0.1:4566:4566"]
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent   # mantém os recursos ao reiniciar (padrão do Floci: memória)
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: http://ollama:11434/v1
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: ${MODELO:-qwen2.5:7b}
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_REQUEST_TIMEOUT_SECONDS: 300   # padrão 60 s não basta para respostas longas do 7b
      # Etapas 2, 5 e 6: rode com IAM_ENFORCEMENT=true docker compose up -d
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: ${IAM_ENFORCEMENT:-false}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock   # necessário para o Lambda
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    # 11435 no host: a 11434 já é usada pelo Ollama instalado no sistema
    ports: ["127.0.0.1:11435:11434"]
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
